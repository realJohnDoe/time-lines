<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>YAML Timeline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="module" crossorigin src="./assets/index-D6dSMqES.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D0wg1rZ5.css">
  </head>
  <body class="bg-gray-50 w-screen h-screen flex flex-col">
    <div class="flex flex-col-reverse md:flex-row w-full h-full">
      <!-- Sidebar: fixed bottom bar on mobile, left sidebar on md+ screens -->
      <div
        class="bg-white p-2 flex flex-col gap-2 rounded-t-xl md:rounded-sm md:shadow-sm md:p-4 md:w-[30rem] md:min-w-80 md:h-full"
      >
        <textarea
          id="yaml-input"
          class="border border-gray-200 rounded-sm font-mono p-2 w-full resize-none h-40 md:h-full"
          rows="6"
          placeholder="Paste your YAML here..."
        ></textarea>
        <button
          id="render-btn"
          class="bg-blue-600 text-white px-4 py-2 rounded-sm hover:bg-blue-700 w-full"
        >
          Render Timeline
        </button>
      </div>
      <div class="flex-1 relative mx-4 py-2" style="min-width: 0">
        <div
          id="timeline-wrapper"
          class="h-full w-full overflow-x-auto overflow-y-hidden"
        >
          <div id="timeline" class="relative h-full w-max min-w-full"></div>
        </div>
        <div
          id="zoom-controls"
          class="absolute z-20 flex flex-row gap-2 bottom-8 right-0"
        >
          <button
            id="zoom-in"
            class="w-10 h-10 flex items-center justify-center bg-gray-500 hover:bg-gray-700 text-white text-2xl font-bold leading-none font-mono rounded-sm shadow-xs transition"
            title="Zoom in (increase horizontal scale)"
          >
            +
          </button>
          <button
            id="zoom-out"
            class="w-10 h-10 flex items-center justify-center bg-gray-500 hover:bg-gray-700 text-white text-2xl font-bold leading-none font-mono rounded-sm shadow-xs transition"
            title="Zoom out (decrease horizontal scale)"
          >
            –
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
